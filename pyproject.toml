[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-pdns-connector"
version = "0.1.3"
description = "NetBox plugin: push netbox_dns zones and records to PowerDNS Authoritative (REST API v1)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "NetBox PowerDNS Connector contributors" }]
keywords = ["netbox", "powerdns", "dns", "netbox_dns", "plugin", "ddi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Django",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "httpx>=0.27",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mael-chouteau/netbox-pdns-connector"
Issues = "https://github.com/mael-chouteau/netbox-pdns-connector/issues"
Documentation = "https://github.com/mael-chouteau/netbox-pdns-connector#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netbox_pdns_connector = [
  "templates/**/*.html",
  "migrations/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
